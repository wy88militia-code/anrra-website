name: Prepare transparent ANRRA logo
on:
  workflow_dispatch:
  push:
    paths:
      - 'anrra-master.jpg'
      - '.github/workflows/transparent-logo.yml'
permissions:
  contents: write
jobs:
  make-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install Pillow
      - name: Remove light ivory background while retaining logo
        run: |
          python - <<'PY'
          from PIL import Image,ImageFilter
          import numpy as np
          im=Image.open('anrra-master.jpg').convert('RGB')
          a=np.asarray(im).astype(np.float32)
          # Estimate gently varying ivory background from image edges
          h,w=a.shape[:2]
          edge=np.concatenate([a[:max(3,h//25)].reshape(-1,3),a[-max(3,h//25):].reshape(-1,3),a[:, :max(3,w//25)].reshape(-1,3),a[:,-max(3,w//25):].reshape(-1,3)])
          bg=np.median(edge,axis=0)
          # Detect departures from ivory; preserve golden type and sage foliage
          chroma=a.max(2)-a.min(2)
          darkness=np.maximum(0,np.mean(bg)-a.mean(2))
          distance=np.sqrt(((a-bg)**2).sum(2))
          opacity=np.clip((distance-13)/46,0,1)
          opacity=np.maximum(opacity,np.clip((chroma-22)/50,0,1))
          opacity=np.maximum(opacity,np.clip((darkness-14)/55,0,1))
          rgba=np.concatenate([a.astype('uint8'),(opacity*255).astype('uint8')[:,:,None]],axis=2)
          Image.fromarray(rgba,'RGBA').save('anrra-logo-transparent.png',optimize=True)
          PY
      - name: Commit transparent logo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add anrra-logo-transparent.png
          if ! git diff --cached --quiet; then
            git commit -m 'Generate seamless transparent ANRRA logo'
            git push
          fi
